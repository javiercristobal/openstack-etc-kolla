kolla_base_distro: "ubuntu"
openstack_release: "2025.1"

kolla_internal_vip_address: "192.168.56.30"
network_interface: "enp0s8"
neutron_external_interface: "enp0s9"
enable_neutron_provider_networks: "yes"
neutron_plugin_agent: "openvswitch"
neutron_flat_networks: "physnet1"
neutron_type_drivers: "flat,vlan,vxlan"
neutron_tenant_network_types: "vxlan"

neutron_bridge_name: "br-ex"


enable_haproxy: "yes"

# Custom configs

node_custom_config: "/etc/kolla/config"

# Cinder
enable_cinder: "yes"
enable_cinder_backend_lvm: "yes"

# Horizon + Skyline
enable_horizon: "yes"
enable_skyline: "yes"

# DNS
enable_designate: "yes"
# DNS domain used by Neutron
neutron_dns_domain: "cloud.lab."

#############################
# Nova Virtualization
#############################

nova_compute_virt_type: "qemu"
libvirt_enable_sasl: "no"
force_config_drive: "yes"
# Optional Designate integration
# designate_ns_record: "ns1.cloud.lab."
designate_backend: "bind9"


# Database as a Service

enable_trove: "yes"

# Trove uses RabbitMQ, Keystone, MariaDB, Nova, Neutron
# These should already be enabled.

# Optional: enable Trove guest image builder tools
enable_trove_guestagent: "yes"

# Use the internal VIP for Trove API
trove_api_interface: "{{ api_interface }}"

# Taskmanager communicates with Nova
trove_taskmanager_interface: "{{ api_interface }}"

# Conductor communicates with guest instances
trove_conductor_interface: "{{ api_interface }}"

# Rating/Billing
#enable_cloudkitty: "yes"

# Telemetry
#enable_ceilometer: "yes"
#enable_aodh: "yes"

# Secrets
enable_barbican: "yes"

# Orchestration
enable_heat: "yes"

# Workflow
enable_mistral: "yes"

# Shared filesystems
enable_manila: "yes"

# Monitoring
enable_prometheus: "yes"
enable_grafana: "yes"

# Logging
enable_fluentd: "no"

# Containers / LBaaS
enable_magnum: "yes"
enable_redis: "yes"
enable_octavia: "yes"
#enable_ceilometer: "yes"
#enable_gnocchi: "yes"
enable_ceilometer: "no"
enable_gnocchi: "no"
enable_aodh: "no"
enable_cloudkitty: "no"
mariadb_bind_address: "0.0.0.0"
postgresql_listen_address: "0.0.0.0"
